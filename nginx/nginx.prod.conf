# Pré-requisito: certificados em /etc/nginx/ssl/fullchain.pem e privkey.pem
# (volume ./nginx/ssl no docker-compose.prod.yml). Sem eles o Nginx não inicia.
# Ajustar server_name para o domínio real no primeiro deploy.

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Upload de laudos de solo
    client_max_body_size 20m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        application/json
        application/javascript
        text/javascript
        text/css
        image/svg+xml
        application/xml
        text/xml;

    # Rate limiting por IP do cliente
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_upload:10m  rate=5r/m;
    limit_req_status 429;

    upstream api_upstream {
        least_conn;
        server api:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # HTTP: redireciona para HTTPS, exceto o desafio do Let's Encrypt
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Headers de segurança. Não declarar add_header dentro das locations:
        # isso descartaria os headers herdados deste bloco.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Headers de proxy herdados por todas as locations
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Estáticos da SPA (copiados pela imagem frontend/Dockerfile)
        root /usr/share/nginx/html;
        index index.html;

        location = /health {
            access_log off;
            proxy_pass http://api_upstream;
        }

        # Anti brute-force
        location ~ ^/api/v[0-9]+/auth/ {
            limit_req zone=api_auth burst=5 nodelay;
            proxy_pass http://api_upstream;
        }

        location ~ ^/api/v[0-9]+/.+/upload {
            limit_req zone=api_upload burst=2 nodelay;
            client_max_body_size 50m;
            proxy_read_timeout 120s;
            proxy_pass http://api_upstream;
        }

        location /api/ {
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://api_upstream;
        }

        # Cache: `expires` em vez de add_header dentro da location — add_header aqui
        # descartaria os headers de segurança herdados do server.
        location /assets/ {
            expires 1y;            # nomes com hash do Vite
            access_log off;
            try_files $uri =404;
        }

        location = /index.html {
            expires -1;            # Cache-Control: no-cache
        }

        # Fallback da SPA: rotas profundas servem index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
