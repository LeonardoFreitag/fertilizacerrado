services:
  db:
    image: timescale/timescaledb-ha:pg15
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/home/postgres/pgdata/data
      # Executado apenas na primeira inicialização do volume
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      target: builder
    command: sh -c "pnpm prisma migrate deploy && pnpm exec ts-node-dev --respawn --transpile-only src/server.ts"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      STATION_IMPORTS_DIR: /data/station-imports
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/prisma:/app/prisma:ro
      - station_imports:/data/station-imports
    stop_grace_period: 15s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Workers BullMQ (msa-process, msa-weekly) + agendador semanal; mesma build da API.
  worker:
    build:
      context: ./backend
      target: builder
    command: pnpm exec ts-node-dev --respawn --transpile-only src/worker.ts
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      STATION_IMPORTS_DIR: /data/station-imports
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/prisma:/app/prisma:ro
      - station_imports:/data/station-imports
    stop_grace_period: 15s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # SPA (Vite dev server com HMR). Dependências instaladas no primeiro boot, no volume
  # anônimo de node_modules (não polui o host). Acesse por http://localhost (Nginx).
  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "corepack enable && corepack prepare pnpm@9.15.4 --activate && pnpm install --frozen-lockfile && pnpm dev --host"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      VITE_DEV_API_PROXY: http://api:3000
      # store do pnpm fora do diretório montado (senão viraria frontend/.pnpm-store no host)
      npm_config_store_dir: /pnpm-store
      CI: "true" # pnpm não interativo (aceita reinstalar node_modules quando o layout muda)
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_pnpm_store:/pnpm-store
    depends_on:
      - api

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend

  # ETL ERA5-Land (Python). Não é daemon: `docker compose run --rm etl <comando>`.
  # O profile impede que `docker compose up` o construa/inicie.
  # ETL ERA5-Land como worker da fila era5-ingest. CLI manual:
  # `docker compose run --rm etl status` / `ingest --latest` / `backfill --harvest <id>`.
  etl:
    build: ./backend/etl
    command: worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      STATION_IMPORTS_DIR: /data/station-imports
      CDS_API_URL: ${CDS_API_URL:-https://cds.climate.copernicus.eu/api}
      CDS_API_KEY: ${CDS_API_KEY:-}
      ETL_CACHE_DIR: /data/cache
      QM_MAX_DISTANCE_KM: ${QM_MAX_DISTANCE_KM:-50}
      QM_MIN_YEARS: ${QM_MIN_YEARS:-10}
      QM_WET_DAY_MM: ${QM_WET_DAY_MM:-0.1}
      QM_MAX_RATIO: ${QM_MAX_RATIO:-3}
    volumes:
      - etl_cache:/data/cache
      - station_imports:/data/station-imports
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  adminer:
    image: adminer:4-standalone
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  etl_cache:
  frontend_node_modules:
  frontend_pnpm_store:
  station_imports:
